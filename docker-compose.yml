version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - SIMULATOR_PATH=/simulator/simulator
    volumes:
      # Mount the compiled simulator binary or source code to the backend
      - ./build:/simulator
      - ./uploads:/app/uploads
